spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/transakt_test
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      database: 1
  flyway:
    baseline-on-migrate: false
  kafka:
    listener:
      auto-startup: false

ratelimit:
  requests-per-minute: 10000
  # Thirteen test classes call /auth/login, and under MockMvc every request comes
  # from 127.0.0.1 — so they would all share one counter. LoginRateLimitIntegrationTest
  # overrides this with @TestPropertySource, which also gives it its own context.
  login-attempts-per-minute: 10000

bank:
  decline-rate: 0
  latency:
    min-ms: 0
    max-ms: 0