spring:
  application:
    name: transakt
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:transakt}?sslmode=${DB_SSLMODE:prefer}
    username: ${DB_USER:aman}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      # Defaults to FALSE because most environments this runs in have no broker.
      # Render does not: the consumer would sit retrying localhost:9092 at every
      # boot, which is slow on a 0.1-CPU instance and once cost a deploy its
      # health check. docker-compose sets it true, where a broker really exists.
      # Same shape as WEBHOOK_ALLOW_PRIVATE_TARGETS - the inert default is the
      # one that is correct when somebody forgets to set it.
      auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:false}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
    web:
      pageable:
        max-page-size: 100
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:transakt-dev-secret-key-change-me-min-32-chars}
  expiration-ms: 3600000

ratelimit:
  requests-per-minute: ${RATE_LIMIT_PER_MINUTE:20}
  # Counted per client address, before authentication. Deliberately much lower than
  # the API ceiling: five guesses a minute is generous for a human typing a password
  # and useless for a script.
  login-attempts-per-minute: ${LOGIN_RATE_LIMIT_PER_MINUTE:5}

outbox:
  topic: ${OUTBOX_TOPIC:payment.settled}

webhook:
  # SSRF guard. False means the consumer refuses to deliver to loopback, link-local,
  # private or unresolvable addresses. The default is false so a deploy that forgets
  # this variable fails SAFE. Local development sets it true in docker-compose.
  allow-private-targets: ${WEBHOOK_ALLOW_PRIVATE_TARGETS:false}