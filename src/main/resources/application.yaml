spring:
  application:
    name: transakt
  datasource:
    url: jdbc:postgresql://localhost:5432/transakt
    username: aman
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

jwt:
  secret: ${JWT_SECRET:transakt-dev-secret-key-change-me-min-32-chars}
  expiration-ms: 3600000

ratelimit:
  requests-per-minute: ${RATE_LIMIT_PER_MINUTE:20}