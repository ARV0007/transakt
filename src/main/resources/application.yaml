spring:
  application:
    name: transakt
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:transakt}
    username: ${DB_USER:aman}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
    web:
      pageable:
        max-page-size: 100
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:transakt-dev-secret-key-change-me-min-32-chars}
  expiration-ms: 3600000

ratelimit:
  requests-per-minute: ${RATE_LIMIT_PER_MINUTE:20}

outbox:
  topic: ${OUTBOX_TOPIC:payment.settled}