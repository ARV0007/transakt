services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: transakt
      POSTGRES_PASSWORD: transakt
      POSTGRES_DB: transakt
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transakt -d transakt"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_USER: transakt
      DB_PASSWORD: transakt
      REDIS_HOST: redis
      JWT_SECRET: transakt-dev-secret-key-change-me-min-32-chars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data: