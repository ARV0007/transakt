name: Benchmark

# Runs ApiKeyLookupBenchmark - the API key cache, cold versus warm - and prints its
# BENCH lines to the log and the job summary. Kept out of the main CI job so a slow
# runner never fails a build; trigger it by hand, or it runs when the cache code changes.
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/main/java/com/transakt/transakt/common/ApiKey*.java'
      - 'src/test/java/com/transakt/transakt/ApiKeyLookupBenchmark.java'

jobs:
  benchmark:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: transakt_test
          POSTGRES_USER: aman
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run the benchmark
        run: |
          chmod +x ./mvnw
          ./mvnw test -Dtest=ApiKeyLookupBenchmark -Dsurefire.failIfNoSpecifiedTests=false | tee bench.log
          echo '### API key cache benchmark' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep '^BENCH' bench.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env:
          DB_PASSWORD: postgres
